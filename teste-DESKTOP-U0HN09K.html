<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .resultado {
            margin-top: 20px;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Formulário de Cadastro</h1>
    <form id="form">
        <label for="name">Nome:</label>
        <input type="text" id="name" placeholder="Digite seu nome" required>

        <label for="sobrenome">Sobrenome:</label>
        <input type="text" id="sobrenome" placeholder="Digite seu sobrenome" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" placeholder="Digite sua idade" required>

        <label for="peso">Peso (kg):</label>
        <input type="number" step="0.1" id="peso" placeholder="Digite seu peso" required>

        <label for="fumante">Você é fumante?</label>
        <input type="checkbox" id="fumante">

        <button type="submit">Enviar</button>
    </form>

    <div class="resultado" id="resultado"></div>

    <script>
        let usuarios = [];

        document.getElementById("form").addEventListener("submit", function(event) {
            event.preventDefault();

            // Captura os valores dos campos
            let name1 = document.querySelector("#name");
            let sobrenome1 = document.querySelector("#sobrenome");
            let idade1 = document.querySelector("#idade");
            let peso1 = document.querySelector("#peso");
            let fumante1 = document.querySelector("#fumante");

            let nome = name1.value.trim();
            let sobrenome = sobrenome1.value.trim();
            let idade = parseInt(idade1.value.trim(), 10);
            let peso = parseFloat(peso1.value.trim());
            let fumante = fumante1.checked;

            // Validação básica
            if (!nome || !sobrenome || isNaN(idade) || isNaN(peso)) {
                alert("Por favor, preencha todos os campos corretamente.");
                return;
            }

            // Adiciona o usuário ao array
            usuarios.push({
                name: nome,
                sobrenome: sobrenome,
                idade: idade,
                peso: peso,
                fumante: fumante
            });

            // Exibe a mensagem de resultado
            let mensagem = "";
            if (idade < 18 || peso < 50 || !fumante) {
                mensagem = `Olá ${nome} ${sobrenome}, você não pode entrar.`;
            } else {
                mensagem = `Olá ${nome} ${sobrenome}, você pode entrar.`;
            }

            document.getElementById("resultado").innerHTML += `<p>${mensagem}</p>`;

            // Limpa os campos do formulário
            name1.value = "";
            sobrenome1.value = "";
            idade1.value = "";
            peso1.value = "";
            fumante1.checked = false;
        });
    </script>

</body>
</html>
