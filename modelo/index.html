<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Modelo</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <section class="container">
    <h1>calcule seu IMC</h1>
    <p>O Índice de Massa Corporal (IMC) é um cálculo que permite avaliar o peso de uma pessoa em relação à sua altura. O IMC é uma ferramenta importante para a saúde, pois ajuda a identificar o risco de desenvolver doenças associadas à obesidade. 
    </p>


    <form action=""  id="form">
      <label for="peso">Peso</label>
      <input type="text" id="peso"><br>
      <label for="altura">Altura</label>
      <input type="text" id="altura"><br>
      <button type="submit">Enviar</button>
    </form>

  </section>
  <div id="resultado">

  </div>

  

  <script src="./assets/js/main.js"></script>
</body>

</html>
